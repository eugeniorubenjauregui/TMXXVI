# Plantilla de vhost Nginx para titamedia.com (front estático + proxy mínimo a WordPress).
# Revisar con quien administra el servidor antes de aplicar. Placeholders: <...>
#
# En http { }:
#   map $uri $tm_redirect { default ""; include /etc/nginx/titamedia/redirects.nginx.map; }
#   (archivo generado con: node scripts/generate-redirects.mjs)

upstream wp_origin {
    server <WP_ORIGIN_HOST_O_IP>:443;   # origen actual de WordPress (hostname/IP interno)
}

server {
    listen 80;
    server_name titamedia.com www.titamedia.com;
    return 301 https://titamedia.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.titamedia.com;
    ssl_certificate     <RUTA_CERT>;
    ssl_certificate_key <RUTA_KEY>;
    return 301 https://titamedia.com$request_uri;   # apex es el canónico
}

server {
    listen 443 ssl http2;
    server_name titamedia.com;
    ssl_certificate     <RUTA_CERT>;
    ssl_certificate_key <RUTA_KEY>;

    root <RUTA_CHECKOUT_DEL_REPO>;
    index index.html;
    error_page 404 /404.html;

    # --- Redirects de URLs viejas de WP (ver scripts/generate-redirects.mjs) ---
    if ($tm_redirect = 410) { return 410; }
    if ($tm_redirect)       { return 301 $tm_redirect; }

    # --- Proxy mínimo a WordPress (mismo URL, sin redirect) ---
    location /wp-content/uploads/ {
        proxy_pass https://wp_origin;
        proxy_ssl_server_name on;
        proxy_set_header Host titamedia.com;   # WP mantiene siteurl/home = https://titamedia.com
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Formulario de contactos (POST) y listado de posts que usa generate-blog.mjs
    location = /wp-json/tita/v1/leads {
        limit_except POST OPTIONS { deny all; }
        proxy_pass https://wp_origin;
        proxy_ssl_server_name on;
        proxy_set_header Host titamedia.com;
        proxy_set_header X-Real-IP $remote_addr;   # WP: TITA_LEADS_TRUSTED_IP_HEADER=HTTP_X_REAL_IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Robots-Tag "noindex" always;
    }
    location ~ ^/wp-json/wp/v2/posts(/|$) {
        limit_except GET { deny all; }
        proxy_pass https://wp_origin;
        proxy_ssl_server_name on;
        proxy_set_header Host titamedia.com;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Robots-Tag "noindex" always;
    }

    # Todo lo demás de WP queda cerrado (enumeración de usuarios, xmlrpc, admin, login).
    location ^~ /wp-json/ { return 404; }
    location ~ ^/(xmlrpc\.php|wp-login\.php|wp-admin/) { return 404; }  # abrir con allow <IP_EQUIPO> si editan por este dominio

    # --- Front estático ---
    location ~* \.(?:js|png|webp|svg|jpg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
