<script type="text/x-dc" data-dc-script data-props="{&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;contextualCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#80E593&quot;,&quot;#52C7CF&quot;],&quot;default&quot;:&quot;#80E593&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Color&quot;}}">
class Component extends DCLogic {
  componentDidMount(){ this.start(0); this.mesh(); }
  mesh(){
    const token = (this._mToken = (this._mToken || 0) + 1);
    if(this._mesh){ this._mesh(); this._mesh = null; }
    import('./js/mount-graphic.js').then(({ mountGraphic })=>{
      if(token !== this._mToken) return;
      this._mesh = mountGraphic('#tm-mesh', ()=> import('./js/mesh-gradient.js'), 'initMeshGradient',
        { tone: 'inicio', motion: this.props.motion });
    });
  }
  componentDidUpdate(){ if(this._stop){ this._stop(); this._stop = null; } this.start(0); }
  componentWillUnmount(){ this._stop && this._stop(); this._mesh && this._mesh(); }
  start(tries){
    if(document.querySelector('#tm-hdr') && document.querySelector('#tm-contacto')){
      import('./js/site-motion.js').then(m=>{
        this._stop = m.initMotion({ accent: this.props.accent, motion: this.props.motion, contextualCursor: this.props.contextualCursor });
      });
      return;
    }
    if(tries < 60) requestAnimationFrame(()=>this.start(tries+1));
  }
  renderVals(){ return { yes: true }; }
}
</script>
