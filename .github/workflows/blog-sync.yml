# Sincroniza el blog estático con WordPress: regenera noticias/ + sitemap + redirects
# y abre (o actualiza) un PR "auto/blog-sync" si hay cambios. No despliega nada.
name: Sincronizar blog desde WordPress

on:
  schedule:
    - cron: '0 12 * * *'   # diario, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: blog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerar blog y redirects
        run: |
          node scripts/generate-blog.mjs
          node scripts/generate-redirects.mjs

      - name: Abrir o actualizar PR si hay cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios: el blog ya está al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/blog-sync
          git add -A
          git commit -m "Blog: sincronizar posts desde WordPress"
          git push --force origin auto/blog-sync
          if [ -z "$(gh pr list --head auto/blog-sync --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head auto/blog-sync \
              --title "Blog: sincronizar posts desde WordPress" \
              --body "Regenerado automáticamente con \`generate-blog.mjs\` y \`generate-redirects.mjs\`. Revisa el diff (posts nuevos/editados, listados, sitemap), haz merge y despliega con \`deploy/deploy-prod.sh\`."
          else
            echo "Ya hay un PR abierto; se actualizó con force-push."
          fi

      - name: Merge automático y despliegue (solo si BLOG_AUTOMERGE=true)
        if: ${{ vars.BLOG_AUTOMERGE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head auto/blog-sync --state open --json number --jq '.[0].number')
          [ -n "$pr" ] || { echo "Sin PR abierto: nada que mergear."; exit 0; }
          # Solo se mergea solo si el PR toca únicamente archivos del blog (+ el .htaccess generado, que no se despliega solo).
          fuera=$(gh pr diff "$pr" --name-only | grep -v -E '^(noticias/|noticias\.html$|sitemap\.xml$|deploy/htaccess-titamedia$)' || true)
          if [ -n "$fuera" ]; then
            echo "::warning::El PR toca archivos fuera del blog; no se mergea solo:"; echo "$fuera"; exit 0
          fi
          gh pr merge "$pr" --squash
          # El merge con GITHUB_TOKEN no dispara el workflow de despliegue por push: se lanza explícitamente.
          gh workflow run blog-deploy.yml --ref main -f dry_run=false
